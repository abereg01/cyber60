# GitHub Actions build matrix. CI builds WITHOUT the password macros (the
# secrets file is gitignored, so the keymap falls back to placeholders).
# Firmware with passwords is built locally: tools/build.sh.
#
#   cyber60@rev_e                     → the keyboard (split peripheral)
#   xiao_ble + prospector_dongle(_screen) → the Prospector (central + screen + Studio)
#   settings_reset                    → wipe Bluetooth bonds, flash once per
#                                       device when (re)pairing, then reflash
include:
  - board: cyber60@rev_e
  - board: xiao_ble//zmk
    shield: prospector_dongle prospector_screen
    snippet: studio-rpc-usb-uart
  - board: cyber60@rev_e
    shield: settings_reset
  - board: xiao_ble//zmk
    shield: settings_reset
