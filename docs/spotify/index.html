<!doctype html>
<!--
  The last hop of the desk screen's Spotify login (pi/ in this repo).

  The screen shows a QR code; the phone opens Spotify's login there and
  Spotify sends the browser back here, because it only redirects to https://
  addresses. This page hands the answer on to the screen on the local network:
  the screen put its own address in `state`. Nothing is stored or sent
  anywhere else, and the code is useless without a key that never leaves the
  screen (PKCE).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Desk screen login</title>
<style>
  :root { --ink: #2B4351; --slate: #7A99AC; --pale: #DDE5ED; --aqua: #99D6EA; --bg: #FFFFFF; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #DDE5ED; --slate: #8FAABB; --pale: #24343F; --bg: #16212A; }
  }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg);
         color: var(--ink); font: 600 18px/1.5 system-ui, sans-serif; }
  main { max-width: 26rem; padding: 2rem 1.5rem; }
  h1 { margin: 0 0 .5rem; font-size: 2.2rem; letter-spacing: .02em; }
  p { margin: .5rem 0; color: var(--slate); }
  a.key { display: inline-block; margin-top: 1rem; padding: .9rem 1.6rem; border-radius: 14px;
          background: var(--aqua); color: #2B4351; text-decoration: none;
          box-shadow: 0 6px 0 #66BCD8; }
</style>
</head>
<body>
<main>
  <h1 id="title">One moment…</h1>
  <p id="text">Handing the login to the desk screen.</p>
  <a id="go" class="key" hidden>Continue</a>
</main>
<script>
  const q = new URLSearchParams(location.search);
  const [nonce, ip, port] = (q.get("state") || "").split("~");
  const octet = "(25[0-5]|2[0-4]\\d|1?\\d?\\d)";
  const ipv4 = new RegExp(`^${octet}(\\.${octet}){3}$`);
  // Only ever an address on a home/office network: never an open redirect.
  const local = ipv4.test(ip || "") &&
    (/^10\./.test(ip) || /^192\.168\./.test(ip) || /^172\.(1[6-9]|2\d|3[01])\./.test(ip));
  const okPort = /^\d{4,5}$/.test(port || "") && +port >= 1024 && +port <= 65535;

  const say = (t, s) => { document.getElementById("title").textContent = t;
                          document.getElementById("text").textContent = s; };

  if (!nonce || !local || !okPort) {
    say("Desk screen login",
        "This page finishes the Spotify login for the desk screen. Start it by scanning the QR code on the screen.");
  } else {
    const url = `http://${ip}:${port}/callback${location.search}`;
    const go = document.getElementById("go");
    go.href = url;
    go.hidden = false;
    say("Almost done", "If nothing happens, tap Continue. Your phone must be on the same wifi as the screen.");
    location.replace(url);
  }
</script>
</body>
</html>
