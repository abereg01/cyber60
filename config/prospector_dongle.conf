# Prospector dongle build (xiao_ble + prospector_dongle + prospector_screen).
# The dongle is the split central and the only device that talks to the
# computer (USB, or Bluetooth when unplugged from USB).

CONFIG_ZMK_USB=y

# Screen: the Shoko layout (src/layouts/shoko/). For the previous screen,
# swap the line for CONFIG_PROSPECTOR_STATUS_SCREEN_OPERATOR=y.
CONFIG_PROSPECTOR_STATUS_SCREEN_SHOKO=y
CONFIG_PROSPECTOR_MODIFIER_OS_WINDOWS=y
CONFIG_PROSPECTOR_LAYER_NAME_UPPERCASE=y
# No ambient light sensor fitted: use a fixed brightness (1-100).
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=80

# Mouse-wheel scrolling for the encoder's SCROLL mode (&msc).
CONFIG_ZMK_POINTING=y

# ZMK Studio (https://zmk.studio): remap keys live over USB without
# reflashing. Unlock with SYSTEM + Left Shift first. Needs the
# studio-rpc-usb-uart snippet (build.yaml / tools/build.sh add it).
CONFIG_ZMK_STUDIO=y

# Underglow follows the active layer (see Kconfig for the options).
CONFIG_CYBER60_LAYER_GLOW=y
CONFIG_CYBER60_LAYER_GLOW_BRIGHTNESS=50
