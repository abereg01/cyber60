# Cyber60 keyboard build (board cyber60@rev_e).
#
# A standalone ZMK keyboard: it holds the keymap and talks to the Pi desk
# screen over Bluetooth (BLE profile 1), or to a computer over USB. When a
# computer is connected by USB, keys go there; otherwise over Bluetooth.
# 4pplet's board defconfig already turns on Bluetooth, USB HID, battery
# reporting, deep sleep after 45 min and ZMK Studio over USB.

# Studio (https://zmk.studio, keyboard on USB): unlock first with
# SYSTEM + Left Shift, so a computer it's plugged into can't remap it unasked.
CONFIG_ZMK_STUDIO_LOCKING=y

# Mouse-wheel scrolling for the encoder's SCROLL mode (&msc).
CONFIG_ZMK_POINTING=y

# Underglow follows the active layer (see Kconfig for the options).
CONFIG_CYBER60_LAYER_GLOW=y
CONFIG_CYBER60_LAYER_GLOW_BRIGHTNESS=50
