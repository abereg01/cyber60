# Cyber60 keyboard build (board cyber60@rev_e).
#
# The keyboard is a split PERIPHERAL of the Prospector dongle (again since
# 2026-11-05): it scans the keys and the encoder and sends them to the dongle
# over Bluetooth. Its USB port only charges (and flashes). The keymap, ZMK
# Studio, the password macros and the layer glow all run on the dongle.
#
# The Pi desk screen variant (standalone: keymap + Studio on the keyboard,
# Bluetooth to the Pi) is the same keymap built with a few overrides on the
# command line: `tools/build.sh keyboard-pi` locally, the cyber60-pi entry in
# build.yaml on GitHub. Keep anything Pi-only out of this file.

CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

# 4pplet's board turns Studio on; in this setup it belongs on the dongle.
# (USB HID stays off by a local change in boards/4pplet/cyber60/Kconfig.defconfig.)
CONFIG_ZMK_STUDIO=n
