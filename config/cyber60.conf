# Cyber60 keyboard build (board cyber60@rev_e).
#
# The keyboard is a split PERIPHERAL of the Prospector dongle: it scans keys
# and the encoder and sends them to the dongle over Bluetooth. Its USB port
# only charges. The keymap, Studio and the password macros live on the dongle.

CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

# 4pplet's board turns Studio on; it belongs on the dongle in this setup.
# (USB HID is kept off by a local change in boards/4pplet/cyber60/Kconfig.defconfig.)
CONFIG_ZMK_STUDIO=n
