; Light bar firmware, Waveshare ESP32-C3-Zero (or any ESP32-C3 board), SK6812 RGBW strip.
; Override per strip with build_flags: -DLB_LEDS=42 -DLB_WHITE_K=4500 -DLB_DATA_PIN=0 -DLB_BUDGET_MA=1800
; Build: ../fw-build.sh   (Docker, cache on the pool)
[env:c3zero]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@^2.1.0
    adafruit/Adafruit NeoPixel@^1.12.3
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -std=gnu++17
build_unflags = -std=gnu++11
