# Settings for the desk screen. Edit the copy on the DECK drive and eject it
# (the screen restarts with the change), or edit this file on the SD card's
# "bootfs" drive, put the card back in the Pi and power it on.

# Turn the picture upside down: 180 (0 = as is)
rotate=0

# Show the Mac command key (⌘) instead of the Windows key: 1
mac=0

# A pretend typist, to see the key screen and the dog react without a
# keyboard (the keyboard link isn't built yet): 1 = on, 0 = off
demo=0

# BUILD PHASE ONLY: SSH into the Pi (root, OMV's key only, no password) while
# it sits at home: 1 = on, 0 = off. Read at power-on. Off and removed before
# the Pi goes to work.
ssh=1

# The Spotify developer app (pi/TODO.md). Not a secret: the login uses PKCE.
spotify_client_id=e9713e5dde1a4071be23fdf1f79c58a2

# Show up as a USB drive called DECK on the computer the Pi's USB-C port is
# plugged into, for new versions and settings without taking out the SD card:
# 1 = on, 0 = off
drive=1

# Shelly lamps for the Lights page (swipe right from the keyboard screen), up
# to three, each "light=NAME:deviceid" (one-word name; the ID is in the Shelly
# app: the lamp → Settings → Device information → Device ID).
#light=DESK:a0b1c2d3e4f5
# The Shelly cloud server and key: Shelly app → User settings → Authorization
# cloud key. The key controls every device on that Shelly account, so it
# doesn't stay here: eject DECK and the Pi moves it out of this file.
shelly_server=
shelly_key=
