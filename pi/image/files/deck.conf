# Settings for the desk screen. Edit the copy on the DECK drive and eject it
# (the screen restarts with the change), or edit this file on the SD card's
# "bootfs" drive, put the card back in the Pi and power it on.

# Turn the picture upside down: 180 (0 = as is)
rotate=0

# Show the Mac command key (⌘) instead of the Windows key: 1
mac=0

# Type by itself, so the screen and the dog have something to show until the
# keyboard talks to the Pi: 1 = on, 0 = off
demo=1

# The Spotify developer app (pi/TODO.md). Not a secret: the login uses PKCE.
spotify_client_id=e9713e5dde1a4071be23fdf1f79c58a2

# Show up as a USB drive called DECK on the computer the Pi's USB-C port is
# plugged into, for new versions and settings without taking out the SD card:
# 1 = on, 0 = off
drive=1
